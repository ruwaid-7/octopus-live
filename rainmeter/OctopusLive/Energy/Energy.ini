[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Refresh now
ContextAction=[!CommandMeasure MeasureRunNow "Run"]
ContextTitle2=Edit settings (API key, theme)
ContextAction2=["#@#Settings.inc"]
ContextTitle3=Open error log
ContextAction3=["#@#last-error.txt"]
; Click anywhere on the skin to refresh now
LeftMouseUpAction=[!CommandMeasure MeasureRunNow "Run"]

[Metadata]
Name=Octopus Live - Electricity and gas
Author=ruwaid-7
Information=Electricity and gas right now, side by side. Without a smart gas meter the right half shows today's electricity. Settings are in @Resources\Settings.inc.
Version=1.0
License=MIT

[Variables]
; Defaults, for an older Settings.inc that doesn't have these
Theme=Dark
Interval=60
AmberWatts=500
RedWatts=2000
MaxWatts=4000
MaxGasKW=10
@Include=#@#Settings.inc
@Include2=#@#Themes\#Theme#.inc
FontFace=Segoe UI
ColorLevel=#ColorText#
; Keep this last in [Variables]: it adds the shared measures
@Include3=#@#Shared.inc

[MeasureRight]
Measure=String
String=[MeasureGasKWh]
DynamicVariables=1
Group=Values
IfMatch=^$
IfMatchAction=[!SetOption MeterRightIcon ImageName "#@#Images\bolt.png"][!SetOption MeterRightIcon ImageTint "#ColorMuted#"][!SetOption MeterRightLabel Text "TODAY"][!SetOption MeterRightValue Text "[*MeasureTodayKWh*] kWh"][!SetOption MeterRightSub Text "[*MeasureCostElec*] so far"]
IfNotMatchAction=[!SetOption MeterRightIcon ImageName "#@#Images\flame.png"][!SetOption MeterRightLabel Text "GAS"][!SetOption MeterRightValue Text "[*MeasureGasKWNum:1*] kW"][!SetOption MeterRightSub Text "[*MeasureGasSub*]"]
IfMatchMode=1

[MeasureGasFlame]
Measure=String
String=[MeasureGasOn]
DynamicVariables=1
Group=Values
IfMatch=^1$
IfMatchAction=[!SetOption MeterRightIcon ImageTint "#ColorGas#"]
IfNotMatchAction=[!SetOption MeterRightIcon ImageTint "#ColorMuted#"]
IfMatchMode=1

; ================== METERS ==================

[MeterCard]
Meter=Shape
Shape=Rectangle 0.5,0.5,359,89,20 | Fill Color #ColorCard# | StrokeWidth 1 | Stroke Color #ColorStroke#

[MeterElecIcon]
Meter=Image
ImageName=#@#Images\bolt.png
X=15
Y=15
W=12
H=12
ImageTint=#ColorAmber#
DynamicVariables=1

[MeterElecLabel]
Meter=String
X=32
Y=12
StringAlign=Left
FontFace=#FontFace#
FontSize=8
FontColor=#ColorText2#
AntiAlias=1
DynamicVariables=1
StringStyle=Bold
Text=ELECTRICITY

[MeterElecValue]
Meter=String
X=13
Y=28
StringAlign=Left
FontFace=#FontFace#
FontSize=18
FontColor=#ColorLevel#
AntiAlias=1
DynamicVariables=1
StringStyle=Bold
Group=Meters
InlineSetting=Size | 10
InlinePattern=\s([A-Za-z]+)$
InlineSetting2=Color | #ColorText2#
InlinePattern2=\s([A-Za-z]+)$
Text=[MeasureElecNum] [MeasureElecUnit]

[MeterElecSub]
Meter=String
X=15
Y=63
W=158
H=14
ClipString=1
StringAlign=Left
FontFace=#FontFace#
FontSize=8
FontColor=#ColorMuted#
AntiAlias=1
DynamicVariables=1
Group=Meters
Text=[MeasurePerHour]

[MeterDivider]
Meter=Shape
Shape=Rectangle 180,14,1,62,0 | Fill Color #ColorDivider# | StrokeWidth 0

[MeterRightIcon]
Meter=Image
ImageName=#@#Images\flame.png
X=196
Y=15
W=12
H=12
ImageTint=#ColorGas#
DynamicVariables=1
Group=Meters

[MeterRightLabel]
Meter=String
X=213
Y=12
StringAlign=Left
FontFace=#FontFace#
FontSize=8
FontColor=#ColorText2#
AntiAlias=1
DynamicVariables=1
StringStyle=Bold
Group=Meters
Text=GAS

[MeterRightValue]
Meter=String
X=194
Y=28
StringAlign=Left
FontFace=#FontFace#
FontSize=18
FontColor=#ColorText#
AntiAlias=1
DynamicVariables=1
StringStyle=Bold
Group=Meters
InlineSetting=Size | 10
InlinePattern=\s([A-Za-z]+)$
InlineSetting2=Color | #ColorText2#
InlinePattern2=\s([A-Za-z]+)$
Text=-- kW

[MeterRightSub]
Meter=String
X=196
Y=63
W=150
H=14
ClipString=1
StringAlign=Left
FontFace=#FontFace#
FontSize=8
FontColor=#ColorMuted#
AntiAlias=1
DynamicVariables=1
Group=Meters
Text=
