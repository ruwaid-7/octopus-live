[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Refresh now
ContextAction=[!CommandMeasure MeasureRun "Run"]
ContextTitle2=Edit settings (API key)
ContextAction2=["#@#Settings.inc"]
ContextTitle3=Open error log
ContextAction3=["#@#last-error.txt"]
; Click anywhere on the skin to refresh immediately
LeftMouseUpAction=[!CommandMeasure MeasureRun "Run"]

[Metadata]
Name=Octopus Live
Author=Made with Claude
Information=Live electricity demand and today's usage from an Octopus Home Mini, via the Octopus Energy API. Put your API key in @Resources\Settings.inc.
Version=1.0
License=MIT

[Variables]
@Include=#@#Settings.inc
FontFace=Segoe UI
ColorText=240,240,245
ColorDim=150,150,165
ColorGreen=60,210,140
ColorAmber=255,184,60
ColorRed=255,90,95
ColorLevel=60,210,140

; ================== MEASURES ==================

; Ticks once a second; runs the fetch script every #Interval# seconds (and once at load)
[MeasureTimer]
Measure=Calc
Formula=(MeasureTimer % #Interval#) + 1
IfCondition=MeasureTimer = 1
IfTrueAction=[!CommandMeasure MeasureRun "Run"]

[MeasureRun]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\OctopusFetch.ps1"
State=Hide
Timeout=60000
FinishAction=[!CommandMeasure MeasureData "Update"]

; Reads the values the script wrote to data.txt
[MeasureData]
Measure=WebParser
URL=file://#@#data.txt
RegExp=(?siU)Status=(.*)[\r\n]+Demand=(.*)[\r\n]+TodayKWh=(.*)[\r\n]+ReadAt=(.*)[\r\n]+Updated=(.*)[\r\n]
UpdateRate=600
ForceReload=1
FinishAction=[!UpdateMeasureGroup Values][!UpdateMeterGroup Meters][!Redraw]

[MeasureStatus]
Measure=WebParser
URL=[MeasureData]
StringIndex=1
Group=Values
IfMatch=^OK$
IfMatchAction=[!SetOption MeterStatus Text "live"][!SetOption MeterStatus FontColor "#ColorGreen#"][!SetOption MeterStatus ToolTipText "Connected"]
IfNotMatchAction=[!SetOption MeterStatus Text "[*MeasureStatus*]"][!SetOption MeterStatus FontColor "#ColorAmber#"][!SetOption MeterStatus ToolTipText "[*MeasureStatus*]"]
DynamicVariables=1

[MeasureDemand]
Measure=WebParser
URL=[MeasureData]
StringIndex=2
Group=Values

[MeasureToday]
Measure=WebParser
URL=[MeasureData]
StringIndex=3
Group=Values

[MeasureReadAt]
Measure=WebParser
URL=[MeasureData]
StringIndex=4
Group=Values

[MeasureUpdated]
Measure=WebParser
URL=[MeasureData]
StringIndex=5
Group=Values

; Numeric demand in watts, used for the text, bar, colour and graph
[MeasureWatts]
Measure=Calc
Formula=MeasureDemand
MinValue=0
MaxValue=#MaxWatts#
Group=Values
IfCondition=MeasureWatts >= 1000
IfTrueAction=[!SetOption MeterDemand Text "[*MeasureKW:2*] kW"]
IfFalseAction=[!SetOption MeterDemand Text "[*MeasureWatts:0*] W"]
IfCondition2=MeasureWatts < #AmberWatts#
IfTrueAction2=[!SetVariable ColorLevel "#ColorGreen#"]
IfCondition3=(MeasureWatts >= #AmberWatts#) && (MeasureWatts < #RedWatts#)
IfTrueAction3=[!SetVariable ColorLevel "#ColorAmber#"]
IfCondition4=MeasureWatts >= #RedWatts#
IfTrueAction4=[!SetVariable ColorLevel "#ColorRed#"]

[MeasureKW]
Measure=Calc
Formula=MeasureWatts / 1000
Group=Values

; ================== METERS ==================

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,250,138,12 | Fill Color 16,16,22,215 | StrokeWidth 1 | Stroke Color 255,255,255,18

[MeterTitle]
Meter=String
X=16
Y=12
FontFace=#FontFace#
FontSize=8
FontWeight=600
FontColor=#ColorDim#
StringStyle=Bold
Text=OCTOPUS LIVE
AntiAlias=1

[MeterStatus]
Meter=String
Group=Meters
X=234
Y=12
W=150
H=14
ClipString=1
StringAlign=Right
FontFace=#FontFace#
FontSize=8
FontColor=#ColorDim#
Text=starting...
AntiAlias=1
DynamicVariables=1

[MeterDemand]
Meter=String
Group=Meters
X=14
Y=28
FontFace=#FontFace#
FontSize=24
FontWeight=700
FontColor=#ColorLevel#
Text=-- W
AntiAlias=1
DynamicVariables=1
ToolTipText=Live demand right now

[MeterTodayLabel]
Meter=String
X=234
Y=32
StringAlign=Right
FontFace=#FontFace#
FontSize=8
FontColor=#ColorDim#
Text=TODAY
AntiAlias=1

[MeterToday]
Meter=String
Group=Meters
MeasureName=MeasureToday
X=234
Y=46
StringAlign=Right
FontFace=#FontFace#
FontSize=13
FontWeight=600
FontColor=#ColorText#
Text=%1 kWh
AntiAlias=1
ToolTipText=Electricity used since midnight

[MeterBarTrack]
Meter=Shape
Shape=Rectangle 16,78,218,4,2 | Fill Color 255,255,255,25 | StrokeWidth 0

[MeterBar]
Meter=Bar
Group=Meters
MeasureName=MeasureWatts
X=16
Y=78
W=218
H=4
BarOrientation=Horizontal
BarColor=#ColorLevel#
DynamicVariables=1

; One point per refresh interval -> about 3.5 hours of history at 60s
[MeterGraph]
Meter=Line
Group=Meters
MeasureName=MeasureWatts
X=16
Y=88
W=218
H=26
LineCount=1
LineColor=#ColorLevel#
LineWidth=1.5
AutoScale=1
AntiAlias=1
UpdateDivider=#Interval#
DynamicVariables=1

[MeterFooter]
Meter=String
Group=Meters
MeasureName=MeasureReadAt
MeasureName2=MeasureUpdated
X=16
Y=118
FontFace=#FontFace#
FontSize=7
FontColor=#ColorDim#
Text=Meter reading %1  -  checked %2
AntiAlias=1
