# Builds the Android APK and the Rainmeter skin zip on every push.
# Pushing a tag like v1.0.0 also publishes both as a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # comes with the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: set these repository secrets to sign releases with your own key, so new
      # versions install over old ones. Without them the APK is signed with a throwaway debug key.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Show the key error lines as one annotation on the run summary
            msg=$(grep -v "^> Task" build.log | grep -E -A 30 "^e: |What went wrong" | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $status

      - name: Package files
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/OctopusLive.apk
          (cd rainmeter && zip -r ../dist/OctopusLive-Rainmeter.zip OctopusLive)

      # Make sure the Gemini (AppFunctions) service and its function list made it into the APK
      - name: Check Gemini functions
        run: |
          files=$(unzip -l dist/OctopusLive.apk | grep -o "assets/energy_app_functions[^ ]*" | tr '\n' ' ')
          [ -n "$files" ] || { echo "::error::AppFunctions XML missing from the APK"; exit 1; }
          unzip -p dist/OctopusLive.apk 'classes*.dex' | grep -aq "EnergyAppFunctionService" || { echo "::error::EnergyAppFunctionService missing"; exit 1; }
          fns=$(unzip -p dist/OctopusLive.apk assets/energy_app_functions.xml | grep -o "#[A-Za-z]*" | sort -u | tr '\n' ' ')
          echo "::notice title=Gemini functions::$files| functions: $fns"

      - uses: actions/upload-artifact@v4
        with:
          name: OctopusLive
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
