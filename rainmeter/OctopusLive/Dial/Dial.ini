; Keep this last in [Variables]: it adds the shared measures
@Include3=#@#Shared.inc

[MeasureDialFrac]
Measure=Calc
Formula=Clamp(MeasureWatts / 4000, 0, 1)
Group=Values

[MeasureDotX]
Measure=Calc
Formula=145 - 96 * Cos(MeasureDialFrac * PI)
Group=Values

[MeasureDotY]
Measure=Calc
Formula=152 - 96 * Sin(MeasureDialFrac * PI)
Group=Values

