[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Refresh now
ContextAction=[!CommandMeasure MeasureRunNow "Run"]
ContextTitle2=Edit settings (API key, theme)
ContextAction2=["#@#Settings.inc"]
ContextTitle3=Open error log
ContextAction3=["#@#last-error.txt"]
; Click anywhere on the skin to refresh now
LeftMouseUpAction=[!CommandMeasure MeasureRunNow "Run"]

[Metadata]
Name=Octopus Live - Cost and price
Author=ruwaid-7
Information=Today's cost so far (electricity and gas), the price now and the next price. Settings are in @Resources\Settings.inc.
Version=1.0
License=MIT

[Variables]
; Defaults, for an older Settings.inc that doesn't have these
Theme=Dark
Interval=60
AmberWatts=500
RedWatts=2000
MaxWatts=4000
MaxGasKW=10
@Include=#@#Settings.inc
@Include2=#@#Themes\#Theme#.inc
FontFace=Segoe UI
ColorLevel=#ColorText#
; Keep this last in [Variables]: it adds the shared measures
@Include3=#@#Shared.inc

[MeasureGasRow]
Measure=String
String=[MeasureGasKWh]
DynamicVariables=1
Group=Values
IfMatch=^$
IfMatchAction=[!HideMeterGroup GasRow]
IfNotMatchAction=[!ShowMeterGroup GasRow]
IfMatchMode=1

[MeasureCheaper]
Measure=String
String=[MeasurePriceCheaper]
DynamicVariables=1
Group=Values
IfMatch=^1$
IfMatchAction=[!SetOption MeterNext FontColor "#ColorGreen#"]
IfNotMatchAction=[!SetOption MeterNext FontColor "#ColorMuted#"]
IfMatchMode=1

; ================== METERS ==================

[MeterCard]
Meter=Shape
Shape=Rectangle 0.5,0.5,209,185,20 | Fill Color #ColorCard# | StrokeWidth 1 | Stroke Color #ColorStroke#

[MeterLabel]
Meter=String
X=16
Y=13
StringAlign=Left
FontFace=#FontFace#
FontSize=8
FontColor=#ColorText2#
AntiAlias=1
DynamicVariables=1
StringStyle=Bold
Text=TODAY SO FAR

[MeterTotal]
Meter=String
X=15
Y=28
StringAlign=Left
FontFace=#FontFace#
FontSize=20
FontColor=#ColorText#
AntiAlias=1
DynamicVariables=1
StringStyle=Bold
Group=Meters
Text=[MeasureCostTotal]

[MeterElecDot]
Meter=Shape
Shape=Rectangle 16,76,8,8,4 | Fill Color #ColorGreen# | StrokeWidth 0

[MeterElec]
Meter=String
X=30
Y=70
StringAlign=Left
FontFace=#FontFace#
FontSize=9
FontColor=#ColorText2#
AntiAlias=1
DynamicVariables=1
Group=Meters
Text=[MeasureCostElec]

[MeterGasDot]
Meter=Shape
Shape=Rectangle 110,76,8,8,4 | Fill Color #ColorGas# | StrokeWidth 0
Group=GasRow

[MeterGas]
Meter=String
X=124
Y=70
StringAlign=Left
FontFace=#FontFace#
FontSize=9
FontColor=#ColorText2#
AntiAlias=1
DynamicVariables=1
Group=Meters | GasRow
Text=[MeasureCostGas]

[MeterDivider]
Meter=Shape
Shape=Rectangle 16,98,178,1,0 | Fill Color #ColorDivider# | StrokeWidth 0

[MeterPriceLabel]
Meter=String
X=16
Y=108
StringAlign=Left
FontFace=#FontFace#
FontSize=8
FontColor=#ColorText2#
AntiAlias=1
DynamicVariables=1
StringStyle=Bold
Text=PRICE NOW

[MeterPrice]
Meter=String
X=15
Y=123
StringAlign=Left
FontFace=#FontFace#
FontSize=13.5
FontColor=#ColorText#
AntiAlias=1
DynamicVariables=1
StringStyle=Bold
Group=Meters
InlineSetting=Size | 8
InlinePattern=\s(per kWh)$
InlineSetting2=Color | #ColorMuted#
InlinePattern2=\s(per kWh)$
Text=[MeasurePriceNow] per kWh

[MeterNext]
Meter=String
X=16
Y=152
W=180
H=14
ClipString=1
StringAlign=Left
FontFace=#FontFace#
FontSize=8
FontColor=#ColorMuted#
AntiAlias=1
DynamicVariables=1
Group=Meters
Text=[MeasurePriceNote]
