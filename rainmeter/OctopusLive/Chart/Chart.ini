[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Refresh now
ContextAction=[!CommandMeasure MeasureRunNow "Run"]
ContextTitle2=Edit settings (API key, theme)
ContextAction2=["#@#Settings.inc"]
ContextTitle3=Open error log
ContextAction3=["#@#last-error.txt"]
; Click anywhere on the skin to refresh now
LeftMouseUpAction=[!CommandMeasure MeasureRunNow "Run"]

[Metadata]
Name=Octopus Live - Today's chart
Author=ruwaid-7
Information=Today's 48 half-hours of electricity, with the total, cost and peak half-hour. Settings are in @Resources\Settings.inc.
Version=1.0
License=MIT

[Variables]
; Defaults, for an older Settings.inc that doesn't have these
Theme=Dark
Interval=60
AmberWatts=500
RedWatts=2000
MaxWatts=4000
MaxGasKW=10
@Include=#@#Settings.inc
@Include2=#@#Themes\#Theme#.inc
FontFace=Segoe UI
ColorLevel=#ColorText#
BarsX=16
BarsBase=118
BarsHeight=78
BarWidth=5
BarGap=2
; Keep this last in [Variables]: it adds the shared measures
@Include3=#@#Shared.inc

[MeasureChart]
Measure=Script
ScriptFile=#@#Scripts\Chart.lua
Group=Values
DynamicVariables=1

; ================== METERS ==================

[MeterCard]
Meter=Shape
Shape=Rectangle 0.5,0.5,365,171,20 | Fill Color #ColorCard# | StrokeWidth 1 | Stroke Color #ColorStroke#

[MeterLabel]
Meter=String
X=16
Y=13
StringAlign=Left
FontFace=#FontFace#
FontSize=8
FontColor=#ColorText2#
AntiAlias=1
DynamicVariables=1
StringStyle=Bold
Text=TODAY

[MeterTotal]
Meter=String
X=350
Y=11
W=250
H=18
ClipString=1
StringAlign=Right
FontFace=#FontFace#
FontSize=10
FontColor=#ColorText#
AntiAlias=1
DynamicVariables=1
StringStyle=Bold
Group=Meters
Text=[MeasureTodayLine]

