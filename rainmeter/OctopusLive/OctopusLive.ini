[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Refresh now
ContextAction=[!CommandMeasure MeasureRun "Run"]
ContextTitle2=Edit settings (API key)
ContextAction2=["#@#Settings.inc"]
ContextTitle3=Open error log
ContextAction3=["#@#last-error.txt"]
; Click anywhere on the skin to refresh immediately
LeftMouseUpAction=[!CommandMeasure MeasureRun "Run"]

[Metadata]
Name=Octopus Live
Author=ruwaid-7
Information=Live electricity demand and today's usage from an Octopus Home Mini, via the Octopus Energy API. Put your API key in @Resources\Settings.inc. Unofficial - not affiliated with Octopus Energy.
Version=1.4
License=MIT

[Variables]
; Defaults for settings added in later versions (Settings.inc overrides these)
MaxGasKW=10
@Include=#@#Settings.inc
FontFace=Segoe UI
; Palette - matches the Android widget
ColorCard=16,0,43,242
ColorCardStroke=255,255,255,51
ColorPill=29,11,64,255
ColorPillStroke=255,255,255,26
ColorTrack=255,255,255,56
ColorAccent=240,80,248
ColorText=255,255,255
ColorDim=184,178,200
ColorGreen=0,230,118
ColorAmber=255,179,0
ColorRed=255,82,82
ColorGas=255,138,61
ColorLevel=0,230,118
; Layout
Width=250
Pad=16

; ================== MEASURES ==================

; Ticks once a second; runs the fetch script every #Interval# seconds (and once at load)
[MeasureTimer]
Measure=Calc
Formula=(MeasureTimer % #Interval#) + 1
IfCondition=MeasureTimer = 1
IfTrueAction=[!CommandMeasure MeasureRun "Run"]

[MeasureRun]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\OctopusFetch.ps1"
State=Hide
Timeout=60000
FinishAction=[!CommandMeasure MeasureData "Update"]

; Reads the values the script wrote to data.txt
[MeasureData]
Measure=WebParser
URL=file://#@#data.txt
RegExp=(?siU)Status=(.*)[\r\n]+Demand=(.*)[\r\n]+TodayKWh=(.*)[\r\n]+ReadAt=(.*)[\r\n]+Updated=(.*)[\r\n]+GasKWh=(.*)[\r\n]+GasAt=(.*)[\r\n]+GasKW=(.*)[\r\n]
UpdateRate=600
ForceReload=1
FinishAction=[!UpdateMeasureGroup Values][!UpdateMeterGroup Meters][!Redraw]

[MeasureStatus]
Measure=WebParser
URL=[MeasureData]
StringIndex=1
Group=Values
IfMatch=^OK$
IfMatchAction=[!SetOption MeterStatus Text "● live"][!SetOption MeterStatus FontColor "#ColorGreen#"][!SetOption MeterStatus ToolTipText "Connected"]
IfNotMatchAction=[!SetOption MeterStatus Text "⚠ [*MeasureStatus*]"][!SetOption MeterStatus FontColor "#ColorAmber#"][!SetOption MeterStatus ToolTipText "[*MeasureStatus*]"]
DynamicVariables=1

[MeasureDemand]
Measure=WebParser
URL=[MeasureData]
StringIndex=2
Group=Values

[MeasureToday]
Measure=WebParser
URL=[MeasureData]
StringIndex=3
Group=Values

[MeasureReadAt]
Measure=WebParser
URL=[MeasureData]
StringIndex=4
Group=Values

[MeasureUpdated]
Measure=WebParser
URL=[MeasureData]
StringIndex=5
Group=Values

; Gas: today's kWh and the time of the latest half-hourly gas reading (blank = no smart gas meter)
[MeasureGas]
Measure=WebParser
URL=[MeasureData]
StringIndex=6
Group=Values
IfMatch=^$
IfMatchAction=[!SetOption MeterGasValue Text "no smart gas meter"][!SetOption MeterGasValue FontColor "#ColorDim#"][!HideMeterGroup GasBar]
IfNotMatchAction=[!SetOption MeterGasValue Text "[*MeasureGas*] kWh  ·  [*MeasureGasKW:1*] kW  ·  [*MeasureGasAt*]"][!SetOption MeterGasValue FontColor "#ColorText#"][!ShowMeterGroup GasBar]
DynamicVariables=1

[MeasureGasAt]
Measure=WebParser
URL=[MeasureData]
StringIndex=7
Group=Values

; Gas rate: average kW over the latest half-hour (gas meters report every 30 minutes)
[MeasureGasKWText]
Measure=WebParser
URL=[MeasureData]
StringIndex=8
Group=Values

[MeasureGasKW]
Measure=Calc
Formula=MeasureGasKWText
Group=Values

[MeasureGasBarWidth]
Measure=Calc
Formula=Max(1, Clamp(MeasureGasKW / #MaxGasKW#, 0, 1) * 184)
Group=Values

; Numeric demand in watts, used for the text, bar, colour and graph
[MeasureWatts]
Measure=Calc
Formula=MeasureDemand
MinValue=0
MaxValue=#MaxWatts#
Group=Values
IfCondition=MeasureWatts >= 1000
IfTrueAction=[!SetOption MeterDemand Text "[*MeasureKW:2*] kW"]
IfFalseAction=[!SetOption MeterDemand Text "[*MeasureWatts:0*] W"]
IfCondition2=MeasureWatts < #AmberWatts#
IfTrueAction2=[!SetVariable ColorLevel "#ColorGreen#"]
IfCondition3=(MeasureWatts >= #AmberWatts#) && (MeasureWatts <= #RedWatts#)
IfTrueAction3=[!SetVariable ColorLevel "#ColorAmber#"]
IfCondition4=MeasureWatts > #RedWatts#
IfTrueAction4=[!SetVariable ColorLevel "#ColorRed#"]

[MeasureKW]
Measure=Calc
Formula=MeasureWatts / 1000
Group=Values

; Width of the filled part of the electricity bar (bar is 184 px wide)
[MeasureBarWidth]
Measure=Calc
Formula=Max(1, Clamp(MeasureWatts / #MaxWatts#, 0, 1) * 184)
Group=Values

; ================== METERS ==================

; Navy card with a faint white edge so it shows on light and dark wallpapers
[MeterBackground]
Meter=Shape
Shape=Rectangle 0.5,0.5,249,163,16 | Fill Color #ColorCard# | StrokeWidth 1 | Stroke Color #ColorCardStroke#

[MeterTitle]
Meter=String
X=#Pad#
Y=13
FontFace=#FontFace#
FontSize=7
FontWeight=700
FontColor=#ColorAccent#
StringStyle=Bold
Text=OCTOPUS LIVE
AntiAlias=1

[MeterStatus]
Meter=String
Group=Meters
X=234
Y=13
W=150
H=14
ClipString=1
StringAlign=Right
FontFace=#FontFace#
FontSize=7
FontWeight=600
FontColor=#ColorDim#
Text=starting...
AntiAlias=1
DynamicVariables=1

; Hero number: live demand, coloured green / amber / red
[MeterDemand]
Meter=String
Group=Meters
X=13
Y=27
FontFace=#FontFace#
FontSize=24
FontWeight=900
FontColor=#ColorLevel#
Text=-- W
AntiAlias=1
DynamicVariables=1
ToolTipText=Live demand right now

; "Today" pill on the right
[MeterTodayPill]
Meter=Shape
Shape=Rectangle 156,29,78,36,11 | Fill Color #ColorPill# | StrokeWidth 1 | Stroke Color #ColorPillStroke#

[MeterTodayLabel]
Meter=String
X=226
Y=34
StringAlign=Right
FontFace=#FontFace#
FontSize=6
FontWeight=600
FontColor=#ColorDim#
Text=TODAY
AntiAlias=1

[MeterToday]
Meter=String
Group=Meters
MeasureName=MeasureToday
X=226
Y=45
StringAlign=Right
FontFace=#FontFace#
FontSize=10
FontWeight=700
StringStyle=Bold
FontColor=#ColorText#
Text=%1 kWh
AntiAlias=1
ToolTipText=Electricity used since midnight

; ---- Two bars: electricity (live) and gas (latest half-hour) ----
[MeterElecLabel]
Meter=String
X=#Pad#
Y=72
FontFace=#FontFace#
FontSize=6
FontWeight=700
StringStyle=Bold
FontColor=#ColorDim#
Text=ELEC
AntiAlias=1

[MeterBarTrack]
Meter=Shape
Shape=Rectangle 50,76,184,5,2.5 | Fill Color #ColorTrack# | StrokeWidth 0

[MeterBar]
Meter=Shape
Group=Meters
Shape=Rectangle 50,76,[MeasureBarWidth],5,2.5 | Fill Color #ColorLevel# | StrokeWidth 0
DynamicVariables=1
ToolTipText=Electricity right now (bar full = #MaxWatts# W)

[MeterGasBarLabel]
Meter=String
Group=GasBar
X=#Pad#
Y=86
FontFace=#FontFace#
FontSize=6
FontWeight=700
StringStyle=Bold
FontColor=#ColorGas#
Text=GAS
AntiAlias=1

[MeterGasBarTrack]
Meter=Shape
Group=GasBar
Shape=Rectangle 50,90,184,5,2.5 | Fill Color #ColorTrack# | StrokeWidth 0

[MeterGasBar]
Meter=Shape
Group=Meters | GasBar
Shape=Rectangle 50,90,[MeasureGasBarWidth],5,2.5 | Fill Color #ColorGas# | StrokeWidth 0
DynamicVariables=1
ToolTipText=Gas: average over the latest half-hour (bar full = #MaxGasKW# kW). Gas meters report every 30 minutes.

; Gas totals row
[MeterGasLabel]
Meter=String
X=#Pad#
Y=104
FontFace=#FontFace#
FontSize=7
FontWeight=700
StringStyle=Bold
FontColor=#ColorGas#
Text=GAS TODAY
AntiAlias=1
ToolTipText=Gas used since midnight, and the average rate over the latest half-hour.

[MeterGasValue]
Meter=String
Group=Meters
X=234
Y=102
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontWeight=700
StringStyle=Bold
FontColor=#ColorText#
Text=-- kWh
AntiAlias=1
DynamicVariables=1

; History: one point per refresh
[MeterGraph]
Meter=Line
Group=Meters
MeasureName=MeasureWatts
X=#Pad#
Y=120
W=218
H=20
LineCount=1
LineColor=#ColorLevel#,170
LineWidth=1.5
AutoScale=1
AntiAlias=1
UpdateDivider=#Interval#
DynamicVariables=1

[MeterFooter]
Meter=String
Group=Meters
MeasureName=MeasureReadAt
MeasureName2=MeasureUpdated
X=#Pad#
Y=145
FontFace=#FontFace#
FontSize=7
FontWeight=500
FontColor=#ColorDim#
Text=Meter %1  ·  checked %2
AntiAlias=1
